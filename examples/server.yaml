# Gatekeeper Server 配置示例
# 拷贝到以下任一位置即可被自动加载:
#   ./gatekeeper.yaml | ~/.gatekeeper/gatekeeper.yaml | /etc/gatekeeper/gatekeeper.yaml
# 也可用 -config <path> 显式指定。命令行 flag 与同名环境变量会覆盖本文件。

# ---- 字段校验规则 ----
# 为防止特殊字符破坏 session 解析(session 格式 "username|role|expires")、
# LIKE 通配符注入、以及存储滥用，所有用户输入均有以下白名单/长度限制:
#
#   字段              格式限制                              最大长度
#   ───────────────   ──────────────────────────────────   ────────
#   username          仅 [a-zA-Z0-9_-]                     64
#   agent_id          仅 [a-zA-Z0-9._-]                    128
#   password          任意可见字符(需>=8位)                  -
#   shell pattern     任意可见字符                          500
#   shell rule note   任意字符                              256
#   token note        任意字符                              256
#   token bind_aid    同 agent_id                           128
#   dispatch user     任意字符                              64
#   agent tags        每项任意, 最多 20 项                   -
#   agent notes       任意字符                              256
#   batch agent_ids   每项同 agent_id, 最多 100 项          -
#
# 超出限制时 API 返回 400 Bad Request; 格式不符同样拒绝。
# 这些限制同时保护了数据库 LIKE 查询和 session 值的 | 分隔符解析。

# 监听地址。生产建议内网 + 443 端口套 TLS。
listen: ":8443"

# SQLite 数据库路径。WAL 模式，可热备份(复制主文件 + 一次性 checkpoint 即可)。
# 兼容旧配置: db_path 等价于 db.type=sqlite + db.dsn。
db_path: "/var/lib/gatekeeper/gatekeeper.db"

# 数据库配置(可选)。支持 sqlite / mysql / postgres。
# 默认 sqlite; 切换到 mysql/postgres 时填写 dsn, sqlite 时 dsn 留空(用 db_path)。
db:
  type: "sqlite"  # sqlite / mysql / postgres
  # MySQL 示例: "user:pass@tcp(127.0.0.1:3306)/gatekeeper?parseTime=true&charset=utf8mb4"
  # PG 示例:    "postgres://user:pass@localhost:5432/gatekeeper?sslmode=disable"
  dsn: ""

# 日志级别: debug / info / warn / error
log_level: "info"

tls:
  cert: ""  # /etc/gatekeeper/server.crt
  key:  ""  # /etc/gatekeeper/server.key

ui:
  # 管理员登录口令。留空则首次启动自动生成并打印一次到日志，写入数据库 settings 表。
  # 生产建议显式设置强口令；遗忘时可清空 settings.admin_password 行再重启触发重新生成。
  admin_password: "REPLACE-WITH-REAL-PASSWORD"
  # 会话有效期(默认 12h)。浏览器登录后 token 存 localStorage。
  session_ttl: "12h"
  # 是否允许通过 ?t=<admin_password> 直接访问, 生产务必 false。
  allow_query_token: false

agent:
  # 启动时自动登记此 agent token，便于首次接入。也可登录后在 Token 页生成。
  # 注意: 生产等保环境建议每台主机单独发放 token 并显式 bind_agent_id；bootstrap_token 仅用于首装。
  bootstrap_token: ""
  # 心跳超时(超过则判定离线，UI 上灰点)。默认 90s。
  heartbeat_timeout: "90s"
  # 写超时。默认 10s。
  write_timeout: "10s"
  # 是否把 bootstrap token 在首次被某 agent 注册时自动绑定到该 agent_id。
  # 开启后即便 bootstrap_token 泄露，攻击者也无法用它在另一台机器冒名注册别的 agent_id。
  # 默认 true(等保环境推荐保持)。
  bind_bootstrap_token: true

# 信任的前置代理 CIDR 列表。仅当直连对端 IP 命中此列表时才解析 X-Forwarded-For；
# 否则一律使用直连 IP 做登录限速 / 审计，避免公网部署被伪造 XFF 绕过。
# 公网直连或等保环境请留空 []；只有当你前置 nginx/HAProxy 反代时才加入它们所在网段。
# 用 "any" 表示无条件信任(不安全, 仅测试用)。
trusted_proxies: []
# 示例(反代场景):
# trusted_proxies:
#   - "127.0.0.1/8"
#   - "10.0.0.0/8"

defaults:
  # 单条指令未回执的超时，超时自动标记 timeout。默认 60s。
  cmd_timeout: "60s"
  # 历史指令保留时长(作为"等保下限"锁): 默认 180 天, DB settings.audit_retention_days
  # 可在 UI 热调提高但不得低于此值。此为合规下限, 不可被运维绕过。
  # 留空(=0)时下限仍按 180 天兜底。
  history_retention: "4320h"  # 180 天

# agent 健康告警 + 账户巡检过期告警。
# agent 离线: 某 agent 超过 offline_after 未心跳 -> 发告警; 恢复后发恢复事件。
# 账户过期: 巡检发现 status=expired/password_expired, 或距过期 <= warn_days -> 发告警。
# 通知通道: webhook(HTTP POST JSON) 与 邮件(SMTP), 可同时启用。
alerts:
  # 是否启用。false 或 webhook/邮件均未配置则完全不启用(默认)。
  enabled: false
  # 多久未心跳触发告警, 默认 10 分钟。
  offline_after: "10m"
  # 扫描周期, 默认 60s。
  check_interval: "60s"
  # 目标 URL, POST JSON。示例为钉钉机器人风格(请按实际情况替换)。
  webhook_url: ""
  # 可选, 写入 X-Gatekeeper-Token 头, 用于校验请求来源。
  webhook_token: ""
  # 邮件通知(可选)。SMTP 基础设施在此配置; 收件人优先取 admin 用户绑定的邮箱, 可在 Web 端「用户管理」中设置。
  email:
    enabled: false
    host: "smtp.example.com:587"      # SMTP 服务器:端口
    username: "alert@example.com"
    password: ""                       # SMTP 密码/授权码
    from: "alert@example.com"
    to: ""                              # 全局收件人(可空, admin 邮箱 + 此值合并去重后发送)
    use_starttls: true                 # 端口 587 用 STARTTLS(默认)
    use_tls: false                     # 端口 465 用直连 TLS
  # 账户过期告警(可选)。开关与阈值建议在 Web 端「系统设置」中配置。
  account_expired:
    enabled: false
    warn_days: 7                       # 默认预警天数(可在 Web 端覆盖)

# 通用 shell 下发配置。
# shell 默认关闭, 需显式 enabled: true 开启。开启后可在 Web 控制台 Shell 页管理黑白名单规则。
# 黑白名单使用 glob 模式匹配, 黑名单优先级高于白名单。
shell:
  # 是否启用 shell 下发。默认 false, 生产环境建议仅在需要时开启。
  enabled: false
  # shell 命令执行超时(默认 60s), 超时后 agent 终止命令并返回截断输出。
  timeout: "60s"
  # 输出截断字节数(默认 65536), 防止大量输出撑爆内存。
  max_output: 65536

# 观测性指标端点。
# /healthz 始终暴露(供负载均衡/容器探活), 返回 JSON 含 status/db_ok/agents_online 等。
# /metrics 输出 Prometheus text format, 供 Prometheus / VictoriaMetrics 抓取。
metrics:
  enabled: true  # 是否暴露 /metrics, 默认 true。生产建议通过内网/防火墙限制访问。