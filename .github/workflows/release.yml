name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X gatekeeper/internal/version.VERSION=${VERSION#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/gatekeeper-server-linux-$arch ./cmd/server
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" \
              -o dist/gatekeeper-agent-linux-$arch ./cmd/agent
          done
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/gatekeeper-server-linux-amd64
            dist/gatekeeper-agent-linux-amd64
            dist/gatekeeper-server-linux-arm64
            dist/gatekeeper-agent-linux-arm64
